<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
        body{
            color:black;
            border:none;
            background-color:darkgray;
        }
        #result{
            height:170px;
            background-color: darkgray;
        }
        #history{
            text-align:right;
            height:20px;
            margin: 0 20px;
            padding-top: 20px;
            font-size: 15px;
            color:#919191;
        }
        #output{
            text-align:right;
            height: 60px;
            margin:10px 20px;
            font-size: 30px;
            color:#919191;
        }
        .keyboard{
            padding:10px;
            background-color: white;
        }
        .operator{
            background-color: orange;
            color:white;
        }
        .number{
            background-color: lightgray;
        }
        .empty{
            padding: 15px;
            background-color: transparent;
            border:none;
        }
        button{
            padding: 10px;
            border-radius: 20px;
        }
        .keyboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            background-color: darkgray;
        }
        .operator:hover{
            background-color: #E65C00;
            color:black;
        }
        .number:hover{
            background-color:#333333;
            color:white;
        }
        .display{
            background-color:gray;
            margin:20px;
            border-radius: 20px;
            border:solid black 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="calculator">
            <div id="result">
                <div class="display">
                                    <div id="history">
                    <p id="history-value"></p>
                </div>
                <div id="output">
                    <p id="output-value"></p>
                </div>
                </div>
            </div>
            <div class="keyboard">
                <button class="operator" id="clear">C</button>
                <button class="operator" id="backspace">CE</button>
                <button class="operator" id="%">%</button>
                <button class="operator" id="/">/</button>
                <button class="number" id="7">7</button>
                <button class="number" id="8">8</button>
                <button class="number" id="9">9</button>
                <button class="operator" id="*">*</button>
                <button class="number" id="4">4</button>
                <button class="number" id="5">5</button>
                <button class="number" id="6">6</button>
                <button class="operator" id="-">-</button>
                <button class="number" id="1">1</button>
                <button class="number" id="2">2</button>
                <button class="number" id="3">3</button>
                <button class="operator" id="+">+</button>
                <button class="empty" id="empty"></button>
                <button class="number" id="0">0</button>
                <button class="empty" id="empty"></button>
                <button class="operator" id="=">=</button>
            </div>
        </div>
    </div>
    <script>
        function gethistory(){
            return document.getElementById("history-value").innerText;
        }
        function printhistory(value){
            document.getElementById("history-value").innerText = value;
        }
        function getoutput(){
            return document.getElementById("output-value").innerText;
        }
        function printoutput(value){
            document.getElementById("output-value").innerText = value;
        }
        var operators = document.getElementsByClassName("operator");

        for (var i =  0;i < operators.length; i++){
            operators[i].addEventListener("click", function (){
                var output = getoutput();
                var history = gethistory();

                if (this.id == "clear") {
                    printhistory("");
                    printoutput("");
                }

                else if (this.id == "backspace") {
                    printoutput(output.slice(0, -1));
                }

                else if(this.id == "=") {
                    printoutput(eval(history + output));
                    printhistory("");
                }

                else{
                    printhistory(history + output + this.id);
                    printoutput("");
                }
            })
        }

        var number = document.getElementsByClassName("number");

        for (var i = 0; i < number.length; i++){
            number[i].addEventListener("click", function(){
                var output = getoutput();

                output = output + this.id;

                printoutput(output);
            })
        }
    </script>
</body>
</html>
